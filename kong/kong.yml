_format_version: "3.0"
_transform: true

# Global CORS plugin: allows all origins, no credentials (safe public mode)
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - "*"
      exposed_headers:
        - "*"
      credentials: false
      max_age: 3600

